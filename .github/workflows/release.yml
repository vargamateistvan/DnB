name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump — leave blank to auto-detect from commit messages'
        required: false
        default: ''
        type: choice
        options: ['', patch, minor, major]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for git log

      # ── 1. Find the latest semver tag ───────────────────────────────────────
      - name: Get latest tag
        id: tag
        run: |
          git fetch --tags
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "latest=${LATEST:-v0.0.0}" >> "$GITHUB_OUTPUT"

      # ── 2. Determine bump type from conventional commits (or manual input) ──
      - name: Detect bump type
        id: bump
        run: |
          LATEST="${{ steps.tag.outputs.latest }}"
          MANUAL="${{ inputs.bump }}"

          if [ "$LATEST" = "v0.0.0" ]; then
            RANGE="HEAD"
          else
            RANGE="${LATEST}..HEAD"
          fi

          COMMITS=$(git log "$RANGE" --pretty=format:"%s%n%b")

          if [ -n "$MANUAL" ]; then
            TYPE="$MANUAL"
          elif echo "$COMMITS" | grep -qE '(BREAKING CHANGE|!:)'; then
            TYPE="major"
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]+\))?!?:'; then
            TYPE="minor"
          elif echo "$COMMITS" | grep -qE '^(fix|perf)(\([^)]+\))?:'; then
            TYPE="patch"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No releasable commits since $LATEST — skipping release."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      # ── 3. Compute the next version number ──────────────────────────────────
      - name: Compute next version
        id: version
        if: steps.bump.outputs.skip != 'true'
        run: |
          V="${{ steps.tag.outputs.latest }}"
          V="${V#v}"
          MAJOR=$(echo "$V" | cut -d. -f1)
          MINOR=$(echo "$V" | cut -d. -f2)
          PATCH=$(echo "$V" | cut -d. -f3)
          case "${{ steps.bump.outputs.type }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          echo "tag=v${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      # ── 4. Build grouped release notes ──────────────────────────────────────
      - name: Build release notes
        id: notes
        if: steps.bump.outputs.skip != 'true'
        env:
          LATEST: ${{ steps.tag.outputs.latest }}
          NEXT: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, re, subprocess, textwrap

          latest = os.environ["LATEST"]
          next_v = os.environ["NEXT"]
          repo   = os.environ["REPO"]
          base   = f"https://github.com/{repo}"

          git_range = "HEAD" if latest == "v0.0.0" else f"{latest}..HEAD"

          # Each record: full_hash \x1f short_hash \x1f subject \x1f body \x1e
          raw = subprocess.check_output(
              ["git", "log", git_range,
               "--pretty=format:%H\x1f%h\x1f%s\x1f%b\x1e"],
              text=True,
          )

          commits = []
          for record in raw.split("\x1e"):
              record = record.strip()
              if not record:
                  continue
              parts = record.split("\x1f", 3)
              if len(parts) < 3:
                  continue
              full, short, subject = parts[0], parts[1], parts[2]
              body = parts[3].strip() if len(parts) == 4 else ""
              commits.append((full, short, subject, body))

          SECTIONS = [
              ("✨ Features",    r"feat(\([^)]+\))?!?:"),
              ("🐛 Bug Fixes",   r"fix(\([^)]+\))?:"),
              ("⚡ Performance", r"perf(\([^)]+\))?:"),
              ("♻️  Refactors",  r"refactor(\([^)]+\))?:"),
              ("🔧 Chores",      r"chore(\([^)]+\))?:"),
              ("📖 Docs",        r"docs(\([^)]+\))?:"),
          ]
          ALL_PREFIXES = r"(feat|fix|perf|refactor|chore|docs|test|ci|build|style)(\([^)]+\))?!?:"

          def strip_prefix(subject, pattern):
              return re.sub(r"^" + pattern + r"\s*", "", subject).strip()

          def fmt_commit(full, short, subject, body, pattern):
              title = strip_prefix(subject, pattern)
              link  = f"[`{short}`]({base}/commit/{full})"
              lines = [f"- **{title}** {link}"]
              if body:
                  # Wrap body lines as a blockquote beneath the entry
                  for para in body.split("\n\n"):
                      para = para.strip()
                      if para:
                          wrapped = textwrap.fill(para, width=120)
                          lines.append(f"  > {wrapped.replace(chr(10), chr(10) + '  > ')}")
              return "\n".join(lines)

          out = ["## What's Changed\n"]

          matched = set()
          for label, pattern in SECTIONS:
              entries = []
              for full, short, subject, body in commits:
                  if re.match(r"^" + pattern, subject):
                      entries.append(fmt_commit(full, short, subject, body, pattern))
                      matched.add(full)
              if entries:
                  out.append(f"### {label}\n")
                  out.extend(entries)
                  out.append("")

          other = [
              fmt_commit(full, short, subject, body, r"")
              for full, short, subject, body in commits
              if full not in matched
          ]
          if other:
              out.append("### 📝 Other\n")
              out.extend(other)
              out.append("")

          if latest != "v0.0.0":
              out.append(f"**Full Changelog**: {base}/compare/{latest}...{next_v}")

          with open("/tmp/release-notes.md", "w") as f:
              f.write("\n".join(out) + "\n")
          PYEOF

      # ── 5. Tag and publish GitHub release ───────────────────────────────────
      - name: Create tag and release
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG="${{ steps.version.outputs.tag }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes-file /tmp/release-notes.md
